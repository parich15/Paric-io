<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Hover y press</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--bg);color:var(--fg);font-family:var(--type-body)} .row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end} .lbl{font-family:var(--type-label);font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-muted);margin-top:6px} .mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--fg-muted)} .sw{width:96px;height:64px;border:3px solid var(--fg)} </style></head><body><div class="row" style="gap:24px;align-items:center;padding:10px 6px">
<a href="#" style="display:inline-block;background:var(--p5-red);color:#F5F5F5;font-family:var(--type-display);font-size:22px;letter-spacing:.06em;padding:10px 30px 12px;clip-path:var(--clip-slant);transition:transform .2s var(--easing-pop),background .2s,color .2s;text-decoration:none" onmouseover="this.style.transform='scale(1.07) rotate(-2deg)';this.style.background='#F5F5F5';this.style.color='#0A0A0A'" onmouseout="this.style.transform='';this.style.background='';this.style.color=''">VER EN VIVO</a>
<span style="display:inline-block;background:var(--fg);color:var(--bg);font-family:var(--type-display);font-size:22px;padding:4px 14px 6px;transform:skewX(-12deg) rotate(-2deg);box-shadow:5px 5px 0 var(--p5-red);transition:transform .2s var(--easing-pop)" onmouseover="this.style.transform='skewX(-12deg) rotate(-2deg) scale(1.06)'" onmouseout="this.style.transform=''">PARIC.IO</span>
<span class="mono">--easing-pop cubic-bezier(.2,1.4,.3,1) · --dur-hover .2s · --hover-scale 1.06</span></div></body></html>
