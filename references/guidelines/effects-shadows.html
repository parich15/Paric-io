<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Sombras duras</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--bg);color:var(--fg);font-family:var(--type-body)} .row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end} .lbl{font-family:var(--type-label);font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-muted);margin-top:6px} .mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--fg-muted)} .sw{width:96px;height:64px;border:3px solid var(--fg)} </style></head><body><div class="row" style="gap:28px;padding:6px 0 14px 4px"><div><div style="width:80px;height:56px;background:var(--fg);box-shadow:4px 4px 0 var(--p5-red)"></div><div class="lbl" style="margin-top:12px">--hard-sm</div></div><div><div style="width:80px;height:56px;background:var(--fg);box-shadow:5px 5px 0 var(--p5-red)"></div><div class="lbl" style="margin-top:13px">--hard</div></div><div><div style="width:80px;height:56px;background:var(--fg);box-shadow:6px 6px 0 var(--p5-red)"></div><div class="lbl" style="margin-top:14px">--hard-md</div></div><div><div style="width:80px;height:56px;background:var(--fg);box-shadow:8px 8px 0 var(--p5-red)"></div><div class="lbl" style="margin-top:16px">--hard-lg</div></div><div><div style="width:80px;height:56px;background:var(--fg);box-shadow:12px 12px 0 var(--p5-red)"></div><div class="lbl" style="margin-top:20px">--hard-xl</div></div><div><div style="width:80px;height:56px;background:var(--fg);box-shadow:16px 16px 0 var(--p5-red)"></div><div class="lbl" style="margin-top:24px">--hard-2xl</div></div><div><div style="width:80px;height:56px;background:var(--p5-paper);border:3px solid var(--p5-ink);box-shadow:5px 5px 0 var(--p5-ink)"></div><div class="lbl" style="margin-top:14px">--hard-ink</div></div></div></body></html>
