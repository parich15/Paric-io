<!-- @dsCard group="Spacing" viewport="700x200" subtitle="Composición típica: fondo con planos inclinados, cabecera fija, contenido con padding 6vw y rejillas auto-fit." name="Layout" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Layout</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--bg);color:var(--fg);font-family:var(--type-body)} .row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end} .lbl{font-family:var(--type-label);font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-muted);margin-top:6px} .mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--fg-muted)} .sw{width:96px;height:64px;border:3px solid var(--fg)} </style></head><body><div style="position:relative;height:160px;border:3px solid var(--fg);overflow:hidden;background:var(--bg)">
<div style="position:absolute;top:-10%;right:-14%;width:46%;height:130%;background:var(--p5-red);transform:skewX(-16deg)"></div>
<div style="position:absolute;top:-10%;left:-8%;width:22%;height:130%;transform:skewX(-14deg);background-color:var(--p5-paper);opacity:.12"><div style="position:absolute;inset:0;background-color:var(--p5-ink);mask:var(--zigzag-mask) 0 0/var(--zigzag-size) repeat"></div></div>
<div style="position:absolute;inset:0;padding:12px 6%;display:flex;flex-direction:column;justify-content:space-between">
<div style="display:flex;justify-content:space-between"><span style="background:var(--fg);color:var(--bg);font-family:var(--type-display);font-size:14px;padding:2px 8px;transform:skewX(-12deg) rotate(-2deg);box-shadow:3px 3px 0 var(--p5-red)">PARIC.IO</span><span style="background:var(--p5-red);color:#fff;font-family:var(--type-label);font-weight:800;font-size:10px;letter-spacing:.18em;padding:4px 10px;clip-path:var(--clip-slant-tight)">MENÚ</span></div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"><div style="height:34px;background:var(--fg);transform:skewX(-6deg);box-shadow:3px 3px 0 var(--p5-red)"></div><div style="height:34px;background:var(--fg);transform:skewX(-6deg);box-shadow:3px 3px 0 var(--p5-red)"></div><div style="height:34px;background:var(--fg);transform:skewX(-6deg);box-shadow:3px 3px 0 var(--p5-red)"></div><div style="height:34px;background:var(--fg);transform:skewX(-6deg);box-shadow:3px 3px 0 var(--p5-red)"></div></div></div></div></body></html>
