<!-- @dsCard group="Type" viewport="700x260" subtitle="Escala display fluida (clamp) y escala fija de UI." name="Escala tipográfica" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Escala tipográfica</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--bg);color:var(--fg);font-family:var(--type-body)} .row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end} .lbl{font-family:var(--type-label);font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-muted);margin-top:6px} .mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--fg-muted)} .sw{width:96px;height:64px;border:3px solid var(--fg)} </style></head><body><div style="display:grid;grid-template-columns:140px 1fr;gap:6px 16px;align-items:baseline;font-family:var(--type-display);text-transform:uppercase;line-height:1">
<span class="mono">--size-h1 · 40–120px</span><span style="font-size:56px">Proyectos</span>
<span class="mono">--size-h2 · 32–56px</span><span style="font-size:40px">Siguiente</span>
<span class="mono">--size-h3 · 22–30px</span><span style="font-size:28px">Front-end lead</span>
<span class="mono">--size-btn-lg · 22px</span><span style="font-size:22px">Ver en vivo</span>
<span class="mono">--size-label · 14px</span><span style="font-family:var(--type-label);font-weight:800;font-size:14px;letter-spacing:.18em">Etiqueta</span>
<span class="mono">--size-label-xs · 12px</span><span style="font-family:var(--type-label);font-weight:800;font-size:12px;letter-spacing:.14em">Tag pequeño</span></div></body></html>
