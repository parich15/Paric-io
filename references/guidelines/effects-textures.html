<!-- @dsCard group="Effects" viewport="700x170" subtitle="Halftone (puntos), zigzag B/N y vetas rojas: siempre a baja opacidad y sobre planos inclinados." name="Texturas" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Texturas</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--bg);color:var(--fg);font-family:var(--type-body)} .row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end} .lbl{font-family:var(--type-label);font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-muted);margin-top:6px} .mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--fg-muted)} .sw{width:96px;height:64px;border:3px solid var(--fg)} </style></head><body><div class="row" style="gap:18px">
<div><div style="width:190px;height:96px;background:var(--p5-red);background-image:var(--halftone-ink);background-size:var(--halftone-size)"></div><div class="lbl">--halftone-ink · 12px</div></div>
<div><div style="width:190px;height:96px;position:relative;background-color:var(--p5-paper)"><div style="position:absolute;inset:0;background-color:var(--p5-ink);mask:var(--zigzag-mask) 0 0/var(--zigzag-size) repeat"></div></div><div class="lbl">--zigzag-mask · 60px</div></div>
<div><div style="width:190px;height:96px;background:var(--stripes-red)"></div><div class="lbl">--stripes-red</div></div></div></body></html>
