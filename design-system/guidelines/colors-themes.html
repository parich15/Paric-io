<!-- @dsCard group="Colors" viewport="700x170" subtitle="Oscuro = PROFESIONAL (por defecto). Claro = PERSONAL vía [data-theme="light"]. El rojo nunca cambia." name="Temas semánticos" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Temas semánticos</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--bg);color:var(--fg);font-family:var(--type-body)} .row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end} .lbl{font-family:var(--type-label);font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-muted);margin-top:6px} .mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--fg-muted)} .sw{width:96px;height:64px;border:3px solid var(--fg)} .lbl{color:inherit;opacity:.7}.mono{color:inherit;opacity:.6}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
<div style="background:var(--bg);color:var(--fg);border:3px solid var(--fg);padding:14px"><div style="font-family:var(--type-display);font-size:28px;text-transform:uppercase">Profesional</div><div class="row" style="margin-top:8px"><div><div class="sw" style="background:var(--bg)"></div><div class="lbl">--bg</div><div class="mono">var(--bg)</div></div><div><div class="sw" style="background:var(--fg)"></div><div class="lbl">--fg</div><div class="mono">var(--fg)</div></div><div><div class="sw" style="background:var(--accent)"></div><div class="lbl">--accent</div><div class="mono">var(--accent)</div></div></div></div>
<div data-theme="light" style="background:var(--bg);color:var(--fg);border:3px solid var(--fg);padding:14px"><div style="font-family:var(--type-display);font-size:28px;text-transform:uppercase">Personal</div><div class="row" style="margin-top:8px"><div><div class="sw" style="background:var(--bg)"></div><div class="lbl">--bg</div><div class="mono">var(--bg)</div></div><div><div class="sw" style="background:var(--fg)"></div><div class="lbl">--fg</div><div class="mono">var(--fg)</div></div><div><div class="sw" style="background:var(--accent)"></div><div class="lbl">--accent</div><div class="mono">var(--accent)</div></div></div></div></div></body></html>
