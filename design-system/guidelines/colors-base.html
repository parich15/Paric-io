<style>body{margin:0;padding:16px 20px;background:var(--bg);color:var(--fg);font-family:var(--type-body)} .row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end} .lbl{font-family:var(--type-label);font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-muted);margin-top:6px} .mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--fg-muted)} .sw{width:96px;height:64px;border:3px solid var(--fg)} </style></head><body><div class="row"><div><div class="sw" style="background:#0A0A0A"></div><div class="lbl">--p5-ink</div><div class="mono">#0A0A0A</div></div><div><div class="sw" style="background:#F5F5F5"></div><div class="lbl">--p5-paper</div><div class="mono">#F5F5F5</div></div><div><div class="sw" style="background:#E60012"></div><div class="lbl">--p5-red</div><div class="mono">#E60012</div></div><div><div class="sw" style="background:#B3000E"></div><div class="lbl">--p5-red-dark</div><div class="mono">#B3000E</div></div><div><div class="sw" style="background:#8F000B"></div><div class="lbl">--p5-red-deep</div><div class="mono">#8F000B</div></div></div></body></html>
