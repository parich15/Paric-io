<!-- @dsCard group="Effects" viewport="700x150" subtitle="Bordes 2/3/4/6px, siempre del color de la tinta. Radio 0 en todo (solo anillos decorativos son redondos)." name="Bordes" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Bordes</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--bg);color:var(--fg);font-family:var(--type-body)} .row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end} .lbl{font-family:var(--type-label);font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-muted);margin-top:6px} .mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--fg-muted)} .sw{width:96px;height:64px;border:3px solid var(--fg)} </style></head><body><div class="row" style="gap:22px;align-items:center"><div style="text-align:center"><div style="width:84px;height:52px;border:2px solid var(--fg)"></div><div class="lbl">--border-2</div></div><div style="text-align:center"><div style="width:84px;height:52px;border:3px solid var(--fg)"></div><div class="lbl">--border-3</div></div><div style="text-align:center"><div style="width:84px;height:52px;border:4px solid var(--fg)"></div><div class="lbl">--border-4</div></div><div style="text-align:center"><div style="width:84px;height:52px;border:6px solid var(--fg)"></div><div class="lbl">--border-6</div></div><div style="text-align:center"><div style="width:84px;height:52px;border:2px dashed var(--fg);display:grid;place-items:center;font-family:var(--type-label);font-weight:800;font-size:9px;letter-spacing:.2em">IMAGEN</div><div class="lbl">placeholder</div></div><div style="text-align:center"><div style="width:52px;height:52px;border:4px dashed var(--fg);border-radius:50%;opacity:.5"></div><div class="lbl">anillo</div></div></div></body></html>
