<!-- @dsCard group="Motion" viewport="700x180" subtitle="Entradas: sello (stamp), subida (rise), diagonal (in). Barrido de pantalla (wipe) en 3 planos. Clic para repetir." name="Animaciones" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Animaciones</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--bg);color:var(--fg);font-family:var(--type-body)} .row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end} .lbl{font-family:var(--type-label);font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-muted);margin-top:6px} .mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--fg-muted)} .sw{width:96px;height:64px;border:3px solid var(--fg)} </style></head><body><div class="row" style="gap:26px;align-items:center;padding:10px 6px;cursor:pointer" onclick="this.querySelectorAll('[data-a]').forEach(e=>{const a=e.style.animation;e.style.animation='none';e.offsetWidth;e.style.animation=a})">
<div data-a style="animation:p5stamp .45s var(--easing-stamp) both;font-family:var(--type-display);font-size:34px;background:var(--fg);color:var(--bg);padding:0 14px 4px">STAMP</div>
<div data-a style="animation:p5rise .5s ease both;font-family:var(--type-display);font-size:34px;background:var(--p5-red);color:#F5F5F5;padding:0 14px 4px">RISE</div>
<div data-a style="animation:p5in .4s var(--easing-slash) both;font-family:var(--type-display);font-size:34px;background:var(--fg);color:var(--bg);padding:0 14px 4px;transform:skewX(-12deg)">IN</div>
<div style="position:relative;width:150px;height:60px;border:3px solid var(--fg);overflow:hidden"><div data-a style="position:absolute;inset:-20%;background:var(--p5-red);animation:p5wipe 1.1s var(--easing-wipe) both"></div><div data-a style="position:absolute;inset:-20%;background:var(--p5-paper);animation:p5wipe 1.1s var(--easing-wipe) .12s both"></div><span class="lbl" style="position:absolute;left:8px;bottom:4px;color:var(--fg)">wipe</span></div>
<span data-a style="animation:p5blink .8s steps(2) infinite;font-family:var(--type-label);font-weight:800;font-size:14px;letter-spacing:.3em">CARGANDO</span></div></body></html>
