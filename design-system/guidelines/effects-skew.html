<!-- @dsCard group="Effects" viewport="700x170" subtitle="Todo bloque de UI se inclina (skew −6…−20°) y gira levemente (−1…−6°). El texto interior se des-inclina." name="Inclinaciones y giros" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Inclinaciones y giros</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--bg);color:var(--fg);font-family:var(--type-body)} .row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end} .lbl{font-family:var(--type-label);font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-muted);margin-top:6px} .mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--fg-muted)} .sw{width:96px;height:64px;border:3px solid var(--fg)} </style></head><body><div class="row" style="gap:22px;align-items:center;padding:8px 0"><div style="text-align:center"><div style="width:72px;height:44px;background:var(--fg);transform:skewX(-6deg);display:grid;place-items:center"><span style="font-family:var(--type-display);color:var(--bg);font-size:14px;transform:skewX(calc(-1*-6deg))">-6deg</span></div><div class="lbl">--skew-xs</div></div><div style="text-align:center"><div style="width:72px;height:44px;background:var(--fg);transform:skewX(-8deg);display:grid;place-items:center"><span style="font-family:var(--type-display);color:var(--bg);font-size:14px;transform:skewX(calc(-1*-8deg))">-8deg</span></div><div class="lbl">--skew-sm</div></div><div style="text-align:center"><div style="width:72px;height:44px;background:var(--fg);transform:skewX(-10deg);display:grid;place-items:center"><span style="font-family:var(--type-display);color:var(--bg);font-size:14px;transform:skewX(calc(-1*-10deg))">-10deg</span></div><div class="lbl">--skew</div></div><div style="text-align:center"><div style="width:72px;height:44px;background:var(--fg);transform:skewX(-12deg);display:grid;place-items:center"><span style="font-family:var(--type-display);color:var(--bg);font-size:14px;transform:skewX(calc(-1*-12deg))">-12deg</span></div><div class="lbl">--skew-md</div></div><div style="text-align:center"><div style="width:72px;height:44px;background:var(--fg);transform:skewX(-16deg);display:grid;place-items:center"><span style="font-family:var(--type-display);color:var(--bg);font-size:14px;transform:skewX(calc(-1*-16deg))">-16deg</span></div><div class="lbl">--skew-lg</div></div><div style="text-align:center"><div style="width:72px;height:44px;background:var(--fg);transform:skewX(-20deg);display:grid;place-items:center"><span style="font-family:var(--type-display);color:var(--bg);font-size:14px;transform:skewX(calc(-1*-20deg))">-20deg</span></div><div class="lbl">--skew-xl</div></div>
<div style="text-align:center"><div style="width:72px;height:44px;background:var(--p5-red);transform:rotate(-4deg)"></div><div class="lbl">--rot-4</div></div>
<div style="text-align:center"><div style="width:90px;height:44px;background:var(--p5-red);clip-path:var(--clip-slant)"></div><div class="lbl">--clip-slant</div></div></div></body></html>
