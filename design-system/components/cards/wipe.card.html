<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Transición</title>
<script src="../../ds-browser.js" data-root="../../"></script>
<style>body{margin:0;padding:20px;background:var(--bg);color:var(--fg);font-family:var(--type-body)} .row{display:flex;flex-wrap:wrap;gap:18px;align-items:center}</style></head><body>
<div id="app"><div class="relative h-[220px] border-3 border-fg overflow-hidden grid place-items-center cursor-pointer" @click="fire">
  <span class="label-p5 text-label tracking-label-xwide text-fg-muted">Clic para lanzar el barrido</span>
  <p5-wipe :show="show" label="Proyectos" :fixed="false"></p5-wipe>
</div></div>
<script>const app = P5.mount('#app', { data: { show: false }, methods: { fire() { this.show = false; setTimeout(() => { this.show = true }, 20); setTimeout(() => { this.show = false }, 1300) } } });</script>
</body></html>
